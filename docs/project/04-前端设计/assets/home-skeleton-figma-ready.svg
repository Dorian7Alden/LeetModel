              <rect x="20" y="34" width="160" height="22" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
              <text x="100" y="49" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c" font-family="monospace">18:42:15 [时钟槽]</text>
              
              <text x="708" y="26" text-anchor="end" class="text-desc">[已交版本进度]</text>
              <text x="708" y="48" text-anchor="end" class="text-title" font-size="12">V2 (中期草稿留痕)</text>
            </g>

            <!-- Roles Row Slot -->
            <g id="Frame: Roles_Row_Slot" transform="translate(20, 126)">
