              <rect x="172" y="0" width="160" height="56" rx="6" class="slot-box" />
              <text x="252" y="24" text-anchor="middle" class="text-desc">[已模拟篇数 / 推荐总量]</text>
              <text x="252" y="46" text-anchor="middle" class="text-title" font-size="16">2 / 3 篇</text>
            </g>

            <!-- Radar Placeholder (W: 332, H: 210) -->
            <g id="Frame: Radar_Placeholder" transform="translate(16, 116)">
