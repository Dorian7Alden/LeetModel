<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980">
  <defs>
    <style>
      .bg-canvas { fill: #f1f5f9; }
      .frame-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .slot-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .slot-box-dashed { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; }
      .slot-hero { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .slot-accent { fill: #2563eb; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-dim { font-family: ui-monospace, monospace; font-size: 10px; fill: #94a3b8; }
      .badge-tag { fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Figma Canvas Background -->
  <rect id="Canvas: Background" class="bg-canvas" width="1440" height="980" />

  <!-- Frame: Desktop 1200 Root Container -->
  <g id="Frame: LeetModel_Home_Desktop_1200" transform="translate(120, 20)">
    <!-- Canvas Shadow / Outer Boundary -->
    <rect id="Rect: Page_Background" class="frame-bg" width="1200" height="940" rx="8" />

    <!-- Topbar Frame (W: 1200, H: 56) -->
    <g id="Frame: Topbar" transform="translate(0, 0)">
      <rect id="Rect: Topbar_BG" fill="#ffffff" width="1200" height="56" rx="8 8 0 0" />
      <line x1="0" y1="56" x2="1200" y2="56" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Slot: Logo (120 x 28) -->
      <g id="Frame: Logo_Slot" transform="translate(32, 14)">
        <rect width="120" height="28" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
        <text x="60" y="18" text-anchor="middle" class="text-title" fill="#2563eb" font-size="12">[Logo 品牌位]</text>
      </g>

      <!-- Slot: Navigation Links (Gap: 24) -->
      <g id="Frame: Nav_Links_Group" transform="translate(180, 19)">
        <!-- Nav Item: 首页 (Active) -->
        <rect x="0" y="0" width="48" height="20" rx="3" fill="#dbeafe" />
        <text x="24" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">首页</text>
        <line x1="0" y1="24" x2="48" y2="24" stroke="#2563eb" stroke-width="2" />
        <!-- Nav Item: 题库 -->
        <text x="76" y="14" font-size="12" fill="#64748b">题库</text>
        <!-- Nav Item: 我的队伍 -->
        <text x="128" y="14" font-size="12" fill="#64748b">我的队伍</text>
        <!-- Nav Item: 排行榜 -->
        <text x="200" y="14" font-size="12" fill="#64748b">排行榜</text>
      </g>

      <!-- Slot: Right Utilities (Search + Avatar) -->
