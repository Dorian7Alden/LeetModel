            <text x="20" y="32" class="text-title">[当前进行中的小队实训 / 赛题名称与年份标签槽位]</text>
            <rect x="640" y="18" width="108" height="20" rx="4" fill="#dbeafe" />
            <text x="694" y="32" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">[真题类别标签]</text>

            <!-- Countdown Box Slot -->
            <g id="Frame: Countdown_Box_Slot" transform="translate(20, 50)">
