            <text x="16" y="32" class="text-title">[赛前高频通道 / 规则与排雷指南]</text>

            <!-- Tool Item 1 -->
            <g id="Frame: Tool_Item_1" transform="translate(16, 48)">
              <rect width="332" height="42" rx="6" class="slot-box" />
              <text x="14" y="26" class="text-title" font-size="12">[队伍广场找队友入口 (急寻编程/论文手)]</text>
              <text x="318" y="26" text-anchor="end" class="text-desc">&gt;</text>
