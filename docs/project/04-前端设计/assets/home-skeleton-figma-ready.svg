              <polygon points="166,60 216,90 200,140 132,140 116,90" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
              <polygon points="166,50 230,86 205,150 125,145 105,85" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.5" />
              <text x="166" y="26" text-anchor="middle" font-size="9" fill="#64748b">[模型假设]</text>
              <text x="260" y="84" text-anchor="start" font-size="9" fill="#64748b">[推导]</text>
              <text x="228" y="176" text-anchor="start" font-size="9" fill="#64748b">[代码]</text>
              <text x="104" y="176" text-anchor="end" font-size="9" fill="#64748b">[规范]</text>
              <text x="76" y="84" text-anchor="end" font-size="9" fill="#64748b">[评价]</text>
              <text x="166" y="196" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">[五维学术技能雷达图挂载框]</text>
