              <rect width="728" height="58" rx="6" class="slot-box" />
              <text x="16" y="24" class="text-title" font-size="13">[赛题条目槽位 2: 2024 美赛 C 题 · 势头动态预测]</text>
              <text x="16" y="44" class="text-desc">[题型标签: 大数据 · 机器学习 · 随机过程]</text>
              <rect x="636" y="16" width="76" height="26" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
              <text x="674" y="33" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">以此题建队</text>
            </g>
          </g>
        </g>

