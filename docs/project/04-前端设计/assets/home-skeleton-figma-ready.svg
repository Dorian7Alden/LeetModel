        <text x="20" y="26" class="text-title" font-size="16">[问候语槽位: 队长姓名 / 欢迎开启建模实训]</text>
        <text x="20" y="46" class="text-desc">[副标题提示: 赛前短周期突击 · 全真演练状态]</text>
        
