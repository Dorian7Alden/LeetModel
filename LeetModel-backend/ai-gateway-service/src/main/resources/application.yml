spring:
  application:
    name: ai-gateway-service
  profiles:
    active: dev
  config:
    import:
      - classpath:leetmodel-observability.yml

server:
  shutdown: graceful

common:
  ai-client:
    enabled: false

ai:
  scheduling:
    enabled: ${AI_SCHEDULING_ENABLED:true}
    concurrency: ${AI_SCHEDULING_CONCURRENCY:4}
    reserved-p0-concurrency: ${AI_SCHEDULING_RESERVED_P0_CONCURRENCY:1}
    max-queue-size: ${AI_SCHEDULING_MAX_QUEUE_SIZE:500}
    reserved-p0-queue-size: ${AI_SCHEDULING_RESERVED_P0_QUEUE_SIZE:50}
    lease-duration: ${AI_SCHEDULING_LEASE_DURATION:15s}
    heartbeat-interval: ${AI_SCHEDULING_HEARTBEAT_INTERVAL:5s}
    result-retention: ${AI_SCHEDULING_RESULT_RETENTION:24h}
    poll-delay-ms: ${AI_SCHEDULING_POLL_DELAY_MS:50}
  new-api:
    base-url: ${NEW_API_BASE_URL:http://127.0.0.1:3000/v1}
    relay-token: ${NEW_API_RELAY_TOKEN:}
    connect-timeout: ${NEW_API_CONNECT_TIMEOUT:10s}
    read-timeout: ${NEW_API_READ_TIMEOUT:10m}
  cost-enrichment:
    enabled: ${AI_COST_ENRICHMENT_ENABLED:true}
    max-attempts: ${AI_COST_ENRICHMENT_MAX_ATTEMPTS:3}
    batch-size: ${AI_COST_ENRICHMENT_BATCH_SIZE:50}
    retry-delay: ${AI_COST_ENRICHMENT_RETRY_DELAY:5m}
    # snapshots 默认为空；只有核验并发布不可变价格版本后才能配置估算价格。
    snapshots: {}
  gateway:
    # 已发布执行配置只允许新增版本；任务入队时保存完整快照，派发不重新解析 routes/别名。
    execution-configs:
      MODEL_CFG_ASSISTANT_TEXT_0001:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 1500
        temperature: 0.2
        response-format: TEXT
        thinking-enabled: false
        prompt-versions: [PROMPT_ASSISTANT_CHAT_0001]
        workflow-versions: [ASSISTANT_CHAT_V1, ASSISTANT_NO_RAG_V1, ASSISTANT_RAG_V1]
      MODEL_CFG_ASSISTANT_TOOLS_0001:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 1500
        temperature: 0.2
        response-format: TEXT
        thinking-enabled: false
        tools: true
        prompt-versions: [PROMPT_ASSISTANT_TOOLS_0001]
        workflow-versions: [ASSISTANT_TOOLS_NO_RAG_V1, ASSISTANT_TOOLS_RAG_V1]
      MODEL_CFG_ASSISTANT_KNOWLEDGE_0001:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 500
        temperature: 0.1
        response-format: TEXT
        thinking-enabled: false
        tools: false
        prompt-versions: [PROMPT_ASSISTANT_KNOWLEDGE_0001]
        workflow-versions: [ASSISTANT_TOOLS_NO_RAG_V1, ASSISTANT_TOOLS_RAG_V1]
      MODEL_CFG_REVIEW_MULTIMODAL_0001:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash-vision-exp
        modality: MULTIMODAL
        max-tokens: 4096
        temperature: 0.1
        response-format: JSON_OBJECT
        thinking-enabled: false
        prompt-versions: [PROMPT_BASIC_REVIEW_0001]
        workflow-versions: [BASIC_REVIEW_V1]
      MODEL_CFG_REVIEW_TEXT_0002:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 8192
        temperature: 0.1
        response-format: JSON_OBJECT
        thinking-enabled: false
        prompt-versions: [PROMPT_EVIDENCE_REVIEW_0001]
        workflow-versions: [EVIDENCE_REVIEW_V2]
      MODEL_CFG_SUGGESTION_TEXT_0001:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 4096
        temperature: 0.1
        response-format: JSON_OBJECT
        thinking-enabled: false
        prompt-versions: [PROMPT_PAPER_SUGGESTION_0001]
        workflow-versions: [IMPROVEMENT_V1]
      MODEL_CFG_SUGGESTION_TEXT_0002:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 8192
        temperature: 0.15
        response-format: JSON_OBJECT
        thinking-enabled: false
        prompt-versions: [PROMPT_GROUNDED_SUGGESTION_0001]
        workflow-versions: [GROUNDED_SUGGESTION_V2]
      MODEL_CFG_KNOWLEDGE_DIRECTORY_0001:
        call-type: CHAT
        provider: NEW_API
        model: deepseek-v4-flash
        modality: TEXT
        max-tokens: 1200
        temperature: 0.0
        response-format: JSON_OBJECT
        thinking-enabled: false
        prompt-versions: [PROMPT_AI_DIRECTORY_0001]
        workflow-versions: [AI_DIRECTORY_V1]
      MODEL_CFG_RAG_V1:
        call-type: EMBEDDING
        logical-model: RAG_V1
        provider: NEW_API
        model: qwen3.7-text-embedding
        embedding-dimension: 1024
        max-batch-size: 32
        max-input-chars: 8192
        max-total-chars: 65536
    embedding-models:
      RAG_V1:
        provider: NEW_API
        model: qwen3.7-text-embedding
        dimension: 1024
        max-batch-size: 32
        max-input-chars: 8192
        max-total-chars: 65536
    routes:
      TEXT:
        provider: NEW_API
        model: deepseek-v4-flash
      MULTIMODAL:
        provider: NEW_API
        model: deepseek-v4-flash-vision-exp
    models:
      "[NEW_API/gemini-3.7-flash-high]":
        display-name: Gemini 3.7 Flash High via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT]
        json-output: true
        thinking: true
        tools: false
      "[NEW_API/deepseek-v4-flash]":
        display-name: DeepSeek V4 Flash via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT]
        json-output: true
        thinking: true
        tools: true
        context-tokens: 1000000
        max-output-tokens: 384000
      "[NEW_API/deepseek-v4-flash-vision-exp]":
        display-name: DeepSeek V4 Flash Vision Experimental via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT, IMAGE_URL]
        json-output: true
        thinking: true
        tools: false
        context-tokens: 1000000
        max-output-tokens: 384000
        max-images: 600
        max-total-image-bytes: 209715200
