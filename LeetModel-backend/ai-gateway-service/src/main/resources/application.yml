spring:
  application:
    name: ai-gateway-service
  profiles:
    active: dev

server:
  shutdown: graceful

common:
  ai-client:
    enabled: false

ai:
  providers:
    deepseek:
      provider-id: deepseek
      display-name: DeepSeek
      base-url: https://api.deepseek.com
      protocol: OPENAI_COMPLETIONS
      secret-ref: DEEPSEEK_API_KEY
      api-key: ${DEEPSEEK_API_KEY:}
      connect-timeout: 10s
      read-timeout: 10m
    kimi:
      provider-id: kimi
      display-name: Kimi
      base-url: https://api.moonshot.cn/v1
      protocol: OPENAI_COMPLETIONS
      secret-ref: KIMI_API_KEY
      api-key: ${KIMI_API_KEY:}
      connect-timeout: 10s
      read-timeout: 10m
  gateway:
    routes:
      GENERAL_TEXT:
        provider: DEEPSEEK
        model: deepseek-v4-pro
      MULTIMODAL:
        provider: DEEPSEEK
        model: deepseek-v4-flash-vision-exp
    models:
      "[DEEPSEEK/deepseek-v4-pro]":
        display-name: DeepSeek V4 Pro
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT]
        json-output: true
        thinking: true
        tools: true
        context-tokens: 1000000
        max-output-tokens: 384000
      "[DEEPSEEK/deepseek-v4-flash-vision-exp]":
        display-name: DeepSeek V4 Flash Vision Experimental
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT, IMAGE_URL]
        json-output: true
        thinking: true
        tools: false
        context-tokens: 1000000
        max-output-tokens: 384000
        max-images: 600
        max-total-image-bytes: 209715200
      "[KIMI/kimi-k2.6]":
        display-name: Kimi K2.6
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT, IMAGE_URL]
        json-output: true
        thinking: true
        tools: true
