spring:
  application:
    name: ai-gateway-service
  profiles:
    active: dev

server:
  shutdown: graceful

common:
  ai-client:
    enabled: false

ai:
  new-api:
    base-url: ${NEW_API_BASE_URL:http://127.0.0.1:3000/v1}
    relay-token: ${NEW_API_RELAY_TOKEN:}
    connect-timeout: ${NEW_API_CONNECT_TIMEOUT:10s}
    read-timeout: ${NEW_API_READ_TIMEOUT:10m}
  cost-enrichment:
    enabled: ${AI_COST_ENRICHMENT_ENABLED:true}
    max-attempts: ${AI_COST_ENRICHMENT_MAX_ATTEMPTS:3}
    batch-size: ${AI_COST_ENRICHMENT_BATCH_SIZE:50}
    retry-delay: ${AI_COST_ENRICHMENT_RETRY_DELAY:5m}
    # snapshots 默认为空；只有核验并发布不可变价格版本后才能配置估算价格。
    snapshots: {}
  gateway:
    routes:
      TEXT:
        provider: NEW_API
        model: deepseek-v4-flash
      MULTIMODAL:
        provider: NEW_API
        model: deepseek-v4-flash-vision-exp
    models:
      "[NEW_API/deepseek-v4-flash]":
        display-name: DeepSeek V4 Flash via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT]
        json-output: true
        thinking: true
        tools: false
        context-tokens: 1000000
        max-output-tokens: 384000
      "[NEW_API/deepseek-v4-flash-vision-exp]":
        display-name: DeepSeek V4 Flash Vision Experimental via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT, IMAGE_URL]
        json-output: true
        thinking: true
        tools: false
        context-tokens: 1000000
        max-output-tokens: 384000
        max-images: 600
        max-total-image-bytes: 209715200
