spring:
  application:
    name: ai-gateway-service
  profiles:
    active: dev

server:
  shutdown: graceful

common:
  ai-client:
    enabled: false

ai:
  scheduling:
    enabled: ${AI_SCHEDULING_ENABLED:true}
    concurrency: ${AI_SCHEDULING_CONCURRENCY:4}
    reserved-p0-concurrency: ${AI_SCHEDULING_RESERVED_P0_CONCURRENCY:1}
    max-queue-size: ${AI_SCHEDULING_MAX_QUEUE_SIZE:500}
    reserved-p0-queue-size: ${AI_SCHEDULING_RESERVED_P0_QUEUE_SIZE:50}
    lease-duration: ${AI_SCHEDULING_LEASE_DURATION:15s}
    heartbeat-interval: ${AI_SCHEDULING_HEARTBEAT_INTERVAL:5s}
    result-retention: ${AI_SCHEDULING_RESULT_RETENTION:24h}
    poll-delay-ms: ${AI_SCHEDULING_POLL_DELAY_MS:50}
  new-api:
    base-url: ${NEW_API_BASE_URL:http://127.0.0.1:3000/v1}
    relay-token: ${NEW_API_RELAY_TOKEN:}
    connect-timeout: ${NEW_API_CONNECT_TIMEOUT:10s}
    read-timeout: ${NEW_API_READ_TIMEOUT:10m}
  cost-enrichment:
    enabled: ${AI_COST_ENRICHMENT_ENABLED:true}
    max-attempts: ${AI_COST_ENRICHMENT_MAX_ATTEMPTS:3}
    batch-size: ${AI_COST_ENRICHMENT_BATCH_SIZE:50}
    retry-delay: ${AI_COST_ENRICHMENT_RETRY_DELAY:5m}
    # snapshots 默认为空；只有核验并发布不可变价格版本后才能配置估算价格。
    snapshots: {}
  gateway:
    embedding-models:
      RAG_V1:
        provider: NEW_API
        model: qwen3.7-text-embedding
        dimension: 1024
        max-batch-size: 32
        max-input-chars: 8192
        max-total-chars: 65536
    routes:
      TEXT:
        provider: NEW_API
        model: deepseek-v4-flash
      MULTIMODAL:
        provider: NEW_API
        model: deepseek-v4-flash-vision-exp
    models:
      "[NEW_API/deepseek-v4-flash]":
        display-name: DeepSeek V4 Flash via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT]
        json-output: true
        thinking: true
        tools: false
        context-tokens: 1000000
        max-output-tokens: 384000
      "[NEW_API/deepseek-v4-flash-vision-exp]":
        display-name: DeepSeek V4 Flash Vision Experimental via new-api
        enabled: true
        protocol: OPENAI_COMPLETIONS
        input-types: [TEXT, IMAGE_URL]
        json-output: true
        thinking: true
        tools: false
        context-tokens: 1000000
        max-output-tokens: 384000
        max-images: 600
        max-total-image-bytes: 209715200
