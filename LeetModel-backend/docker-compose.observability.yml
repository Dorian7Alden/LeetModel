name: leetmodel-observability

services:
  skywalking-banyandb:
    image: apache/skywalking-banyandb:0.11.0
    container_name: leetmodel-skywalking-banyandb
    restart: unless-stopped
    command: standalone --stream-root-path /data/stream --measure-root-path /data/measure
    volumes:
      - skywalking-banyandb-stream:/data/stream
      - skywalking-banyandb-measure:/data/measure
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s

  skywalking-oap:
    image: apache/skywalking-oap-server:11.0.0
    container_name: leetmodel-skywalking-oap
    restart: unless-stopped
    depends_on:
      skywalking-banyandb:
        condition: service_healthy
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: skywalking-banyandb:17912
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: prometheus
      SW_TELEMETRY_PROMETHEUS_HOST: 0.0.0.0
      SW_TELEMETRY_PROMETHEUS_PORT: 1234
      JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "127.0.0.1:11800:11800"
      - "127.0.0.1:12800:12800"
      - "127.0.0.1:17128:17128"
      - "127.0.0.1:11234:1234"
    expose:
      - "1234"
    mem_limit: 1400m
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/12800"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  skywalking-ui:
    image: apache/skywalking-ui:horizon-1.0.0
    container_name: leetmodel-skywalking-ui
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
    environment:
      HORIZON_OAP_QUERY_URL: http://skywalking-oap:12800
      HORIZON_OAP_ADMIN_URL: http://skywalking-oap:17128
      HORIZON_AUTH_BACKEND: local
      HORIZON_AUTH_LOCAL_USERS: "${HORIZON_AUTH_LOCAL_USERS:-[]}"
      HORIZON_SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:18080:8081"
    volumes:
      - skywalking-ui-data:/data
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: leetmodel-prometheus
    restart: unless-stopped
    depends_on:
      skywalking-oap:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=127.0.0.1:19090
      - --web.enable-lifecycle
    network_mode: host
    group_add:
      - "${LEETMODEL_MANAGEMENT_TOKEN_GID:-1000}"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus-rules:/etc/prometheus/rules:ro
      - ./docker/observability/prometheus-targets:/etc/prometheus/targets:ro
      - ./.observability-runtime/prometheus-rules:/etc/prometheus/runtime-rules:ro
      - ./.observability-runtime/prometheus-targets:/etc/prometheus/runtime-targets:ro
      - ${LEETMODEL_MANAGEMENT_TOKEN_FILE:-./.observability-runtime/management-token}:/run/secrets/management_token:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:19090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: leetmodel-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:19093
    network_mode: host
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:19093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.0
    container_name: leetmodel-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "13000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    network_mode: host
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:13000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  skywalking-banyandb-stream:
  skywalking-banyandb-measure:
  skywalking-ui-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
