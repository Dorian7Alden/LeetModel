brokerClusterName=LeetModelLocalCluster
brokerName=leetmodel-broker
brokerId=0
brokerIP1=127.0.0.1
listenPort=10911
namesrvAddr=rocketmq-namesrv:9876

# 本地开发使用单主节点与持久化卷。生产环境不得复用该拓扑。
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
fileReservedTime=168

# 资源必须由 scripts/init-rocketmq.sh 显式创建。
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=false
