global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:19093

scrape_configs:
  - job_name: leetmodel-services
    metrics_path: /actuator/prometheus
    http_headers:
      X-LeetModel-Management-Token:
        files:
          - /run/secrets/management_token
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
          - /etc/prometheus/runtime-targets/*.json
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:19090

  - job_name: skywalking-oap
    static_configs:
      - targets:
          - 127.0.0.1:11234

  - job_name: alertmanager
    static_configs:
      - targets:
          - 127.0.0.1:19093

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:13000
