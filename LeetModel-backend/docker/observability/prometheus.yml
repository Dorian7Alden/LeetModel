global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: skywalking-oap
    static_configs:
      - targets:
          - skywalking-oap:1234

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
