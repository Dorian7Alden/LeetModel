groups:
  - name: leetmodel-platform-recording
    interval: 30s
    rules:
      - record: leetmodel:service_targets:count
        expr: count(up{job="leetmodel-services"})
      - record: leetmodel:service_up:count
        expr: sum(up{job="leetmodel-services"})
      - record: leetmodel:infrastructure_targets:count
        expr: count(up{job=~"prometheus|skywalking-oap|alertmanager|grafana"})
      - record: leetmodel:infrastructure_up:count
        expr: sum(up{job=~"prometheus|skywalking-oap|alertmanager|grafana"})
