# ==================== LeetModel-admin 开发环境配置 ====================

server:
  port: 8084

spring:
  autoconfigure:
    # admin 为纯聚合层，无数据库，禁用 DataSource 自动配置（同 Gateway）
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  data:
    redis:
      host: localhost
      port: 6379

# JWT
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
