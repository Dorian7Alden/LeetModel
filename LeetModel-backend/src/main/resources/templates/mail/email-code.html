<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetModel 邮箱验证码</title>
</head>
<body style="margin:0;padding:0;background:#f6f8fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <div style="max-width:640px;margin:0 auto;padding:32px 16px;">
        <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,0.08);">
            <div style="padding:24px 28px;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#ffffff;">
                <div style="font-size:14px;opacity:0.9;letter-spacing:0.04em;">LeetModel</div>
                <h1 style="margin:10px 0 0;font-size:24px;line-height:1.3;">邮箱验证码</h1>
            </div>
            <div style="padding:28px;">
                <p style="margin:0 0 16px;font-size:15px;line-height:1.8;">您好，您正在进行账号验证或密码重置操作，请使用下面的验证码完成验证：</p>
                <div style="margin:24px 0;padding:18px 20px;border:1px dashed #93c5fd;border-radius:14px;background:#eff6ff;text-align:center;">
                    <div style="font-size:13px;color:#2563eb;margin-bottom:10px;">验证码</div>
                    <div style="font-size:34px;font-weight:700;letter-spacing:0.24em;color:#1d4ed8;">${code}</div>
                </div>
                <p style="margin:0 0 10px;font-size:14px;line-height:1.8;color:#4b5563;">验证码有效期为 <strong>${validMinutes} 分钟</strong>，请尽快填写并完成操作。为了保障账户安全，请不要将验证码透露给他人。</p>
                <p style="margin:18px 0 0;font-size:13px;line-height:1.7;color:#6b7280;">如果这不是你本人操作，请忽略此邮件。如有疑问，请联系 <a href="mailto:${supportEmail}" style="color:#2563eb;text-decoration:none;">${supportEmail}</a>。</p>
            </div>
        </div>
    </div>
</body>
</html>
