# ==================== gateway-service 开发环境配置 ====================

server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  autoconfigure:
    # Gateway 不连接数据库，禁用 DataSource 自动配置
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    # Nacos 服务发现
    nacos:
      discovery:
        server-addr: localhost:8848

    # === 路由规则 ===
    # lb:// 前缀 = 从 Nacos 按服务名拉取实例列表 + 负载均衡
    gateway:
      routes:
        # ---- user 服务（8081）----
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        # ---- team 服务（8082）----
        - id: team-service
          uri: lb://team-service
          predicates:
            - Path=/api/teams/**

        # ---- problem 服务（8083）----
        - id: problem-service
          uri: lb://problem-service
          predicates:
            - Path=/api/problems/**

        # ---- 公开题目浏览 ----
        - id: problem-public
          uri: lb://problem-service
          predicates:
            - Path=/api/public/problems/**

        # ---- 标签管理 ----
        - id: tag-service
          uri: lb://problem-service
          predicates:
            - Path=/api/tags/**

        - id: contest-service
          uri: lb://problem-service
          predicates:
            - Path=/api/contests/**

        - id: submission-service
          uri: lb://submission-service
          predicates:
            - Path=/api/submissions/**

        - id: ai-review-service
          uri: lb://ai-review-service
          predicates:
            - Path=/api/reviews/**

        # ---- 管理后台 ----
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
  # Redis —— JWT Token 黑名单（登出后 Token 不可再用）
  data:
    redis:
      host: localhost
      port: 6379

# JWT 密钥（与 user 服务保持一致，否则校验签名失败）
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

# 暴露 Actuator 端点（K8s 探活/就绪探针）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ==================== Knife4j 网关聚合 ====================
# 原理：Gateway 自身托管 /doc.html 页面，用户切换服务分组时，
# Gateway 转发 /v3/api-docs 请求获取 OpenAPI JSON
# 使用 manual 模式并显式指定 context-path，避免 UI 将路由前缀再拼到接口路径上造成 /api/xxx/api/xxx
knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: user-service
        service-name: user-service
        url: /api/auth/v3/api-docs
        context-path: /
      - name: problem-service
        service-name: problem-service
        url: /api/problems/v3/api-docs
        context-path: /
      - name: team-service
        service-name: team-service
        url: /api/teams/v3/api-docs
        context-path: /
      - name: admin-service
        service-name: admin-service
        url: /api/admin/v3/api-docs
        context-path: /
      - name: submission-service
        service-name: submission-service
        url: /api/submissions/v3/api-docs
        context-path: /
      - name: ai-review-service
        service-name: ai-review-service
        url: /api/reviews/v3/api-docs
        context-path: /

# 鉴权白名单在 SaTokenConfig.java 中通过 .addExclude() 配置，此处不重复声明
