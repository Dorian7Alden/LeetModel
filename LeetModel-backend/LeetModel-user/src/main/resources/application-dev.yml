# ==================== LeetModel-user 开发环境配置 ====================
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://localhost:3306/leetmodel_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data: 
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

server:
  port: 8081

# JWT 密钥（开发环境默认值，生产环境通过 Nacos 配置中心覆盖）
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

# Knife4j API 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
