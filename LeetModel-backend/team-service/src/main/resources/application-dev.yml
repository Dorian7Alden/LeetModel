# ==================== team-service 开发环境配置 ====================

server:
  port: 8082

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/lm_team?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

# MyBatis-Plus
mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id

# JWT
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api/teams/v3/api-docs
