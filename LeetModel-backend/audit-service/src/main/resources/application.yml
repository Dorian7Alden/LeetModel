spring:
  application:
    name: audit-service
  profiles:
    active: dev
  config:
    import:
      - classpath:leetmodel-observability.yml
      - classpath:leetmodel-logging.yml
  datasource:
    url: ${AUDIT_DB_URL:jdbc:mysql://localhost:3306/lm_audit?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${AUDIT_DB_APP_USERNAME:lm_audit_app}
    password: ${AUDIT_DB_APP_PASSWORD:lm-audit-app-local-only-change-me}
    hikari:
      pool-name: audit-service-pool
      minimum-idle: 1
      maximum-pool-size: 8
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    url: ${AUDIT_DB_URL:jdbc:mysql://localhost:3306/lm_audit?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    user: ${AUDIT_DB_MIGRATOR_USERNAME:lm-audit-migrator-local-only-change-me}
    password: ${AUDIT_DB_MIGRATOR_PASSWORD}
    clean-disabled: true
    validate-migration-naming: true
    baseline-on-migrate: false
    # 认证失败不可通过重试恢复；快速失败避免错误凭据阻塞整套服务启动。
    connect-retries: 0

server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}

leetmodel:
  messaging:
    enabled: false
    namespace: ${ROCKETMQ_NAMESPACE:lm-dev}
  audit:
    consumer-enabled: ${AUDIT_CONSUMER_ENABLED:true}
    max-payload-bytes: ${AUDIT_MAX_PAYLOAD_BYTES:65536}
    monitor-delay-ms: ${AUDIT_MONITOR_DELAY_MS:30000}
    retention:
      online-retention-days: ${AUDIT_ONLINE_RETENTION_DAYS:365}
      archive-enabled: ${AUDIT_ARCHIVE_ENABLED:false}
      backup-required: ${AUDIT_BACKUP_REQUIRED:true}
      policy-version: ${AUDIT_RETENTION_POLICY_VERSION:v1}
