# ==================== user-service 公共配置 ====================

spring:
  application:
    name: user-service   # Nacos 中的服务名，与其他微服务唯一区分
  profiles:
    active: dev            # 默认激活开发环境（可通过命令行 --spring.profiles.active=prod 覆盖）
  config:
    import:
      # Nacos 配置中心（optional: Nacos 不可用时回退到本地 yml）
      - optional:nacos:user-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        group: DEFAULT_GROUP
  # 优雅关闭：单阶段等待时间上限（配合下方 server.shutdown: graceful）
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ==================== 优雅关闭 ====================
server:
  shutdown: graceful
