# ==================== user-service 开发环境配置 ====================
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://localhost:3306/lm_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data: 
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

server:
  port: 8081

# JWT 密钥（开发环境默认值，生产环境通过 Nacos 配置中心覆盖）
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

# Knife4j API 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api/auth/v3/api-docs
  group-configs:
    - group: 'user-service'
      display-name: '用户服务'
      paths-to-match: '/**'
      packages-to-scan: com.leetmodel.user.controller

# 暴露 Actuator 端点
# MinIO 对象存储
minio:
  enabled: true
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: leetmodel
