spring:
  application:
    name: ai-assistant-service
  profiles:
    active: dev

server:
  shutdown: graceful

assistant:
  rag:
    # RAG V1 默认关闭；启用前需完成索引构建并切换读别名。
    enabled: ${ASSISTANT_RAG_ENABLED:false}
    knowledge-base-path: ${ASSISTANT_RAG_KB_PATH:../rag_kb}
    index-alias: ${ASSISTANT_RAG_INDEX_ALIAS:leetmodel-rag-v1-read}
    embedding-model-version: ${ASSISTANT_RAG_EMBEDDING_MODEL_VERSION:qwen3.7-text-embedding@1024}
    top-k: ${ASSISTANT_RAG_TOP_K:8}
    score-threshold: ${ASSISTANT_RAG_SCORE_THRESHOLD:0.65}
    token-budget: ${ASSISTANT_RAG_TOKEN_BUDGET:3000}
    embedding-batch-size: ${ASSISTANT_RAG_EMBEDDING_BATCH_SIZE:16}
    chunk-min-tokens: ${ASSISTANT_RAG_CHUNK_MIN_TOKENS:80}
    chunk-target-tokens: ${ASSISTANT_RAG_CHUNK_TARGET_TOKENS:320}
    chunk-max-tokens: ${ASSISTANT_RAG_CHUNK_MAX_TOKENS:480}
    chunk-overlap-tokens: ${ASSISTANT_RAG_CHUNK_OVERLAP_TOKENS:48}
    max-embedding-input-chars: ${ASSISTANT_RAG_MAX_EMBEDDING_INPUT_CHARS:8192}
    request-timeout: ${ASSISTANT_RAG_REQUEST_TIMEOUT:5s}
    store-type: ${ASSISTANT_RAG_STORE_TYPE:ELASTICSEARCH}
