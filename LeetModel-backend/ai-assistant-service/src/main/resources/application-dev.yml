server:
  port: 8089

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lm_ai_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
  flyway:
    enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

common:
  ai-client:
    enabled: true
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}

jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

springdoc:
  api-docs:
    path: /api/assistant/v3/api-docs
