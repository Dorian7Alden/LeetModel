server:
  port: 8085
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lm_submission?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
  flyway:
    enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
minio:
  enabled: true
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: leetmodel
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800
springdoc:
  api-docs:
    path: /api/submissions/v3/api-docs
