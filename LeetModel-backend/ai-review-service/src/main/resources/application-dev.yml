server:
  port: 8086
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lm_review?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
  flyway:
    enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
minio:
  enabled: true
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: leetmodel
common:
  ai-client:
    enabled: true
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
review:
  parse:
    v1:
      max-pages: 80
      max-characters: 240000
  v1:
    max-pages: 40
    render-dpi: 110
    jpeg-quality: 0.78
    max-image-bytes: 8388608
    max-total-image-bytes: 33554432
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800
springdoc:
  api-docs:
    path: /api/reviews/v3/api-docs
