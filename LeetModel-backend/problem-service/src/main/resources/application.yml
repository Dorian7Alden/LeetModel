# ==================== problem-service 公共配置 ====================

spring:
  application:
    name: problem-service   # Nacos 中的服务名，与其他微服务唯一区分
  profiles:
    active: dev            # 默认激活开发环境（可通过命令行 --spring.profiles.active=prod 覆盖）
  config:
    import:
      - classpath:leetmodel-observability.yml
      - classpath:leetmodel-logging.yml
      # Nacos 配置中心（optional: Nacos 不可用时回退到本地 yml）
      - optional:nacos:problem-service-${spring.profiles.active}.yml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
        group: DEFAULT_GROUP
  # 优雅关闭：单阶段等待时间上限（配合下方 server.shutdown: graceful）
  lifecycle:
    timeout-per-shutdown-phase: 30s

# ==================== 优雅关闭 ====================
server:
  shutdown: graceful

leetmodel:
  cache:
    enabled: ${CACHE_ENABLED:true}
    environment: ${CACHE_ENVIRONMENT:${spring.profiles.active:dev}}
    maximum-weight: ${CACHE_LOCAL_MAXIMUM_WEIGHT:67108864}
    maximum-value-bytes: ${CACHE_MAXIMUM_VALUE_BYTES:524288}
    degraded-ttl: 5s
    reconcile-interval: 5000
    outbox-interval: 1000
    ttl-jitter: 0.2
    redis:
      host: ${CACHE_REDIS_HOST:localhost}
      port: ${CACHE_REDIS_PORT:6380}
      database: ${CACHE_REDIS_DATABASE:0}
      password: ${CACHE_REDIS_PASSWORD:}
      ssl: ${CACHE_REDIS_SSL:false}
      connect-timeout: 200ms
      command-timeout: 100ms
