# ==================== problem-service 开发环境配置 ====================
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:mysql://localhost:3306/lm_problem?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

server:
  port: 8083

# Knife4j API 文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api/problems/v3/api-docs
  group-configs:
    - group: 'problem-service'
      display-name: '题目服务'
      paths-to-match: '/**'
      packages-to-scan: com.leetmodel.problem.controller

# JWT 密钥（与 gateway + user 服务保持一致，否则校验签名失败）
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:leetmodel}
  max-file-size: ${MINIO_MAX_FILE_SIZE:52428800}
  expiry-seconds: ${MINIO_EXPIRY_SECONDS:604800}

# 暴露 Actuator 端点
