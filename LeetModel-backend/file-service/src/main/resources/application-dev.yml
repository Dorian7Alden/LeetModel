server:
  port: 8095

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lm_file?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${FILE_MAX_UPLOAD_SIZE:50MB}

jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:leetmodel}
  max-file-size: ${MINIO_MAX_FILE_SIZE:52428800}
  expiry-seconds: ${MINIO_EXPIRY_SECONDS:604800}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api/file-assets/v3/api-docs
  group-configs:
    - group: file-service
      display-name: 文件资产服务
      paths-to-match: '/**'
      packages-to-scan: com.leetmodel.file.controller
