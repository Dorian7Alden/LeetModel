# ==================== LeetModel 本地开发基础设施 ====================
# 使用方式：docker compose up -d --wait mysql redis cache-redis minio nacos new-api elasticsearch

services:
  mysql:
    image: mysql:8.0.33
    container_name: leetmodel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: leetmodel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache-redis:
    image: redis:7.2-alpine
    container_name: leetmodel-cache-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lfu
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: leetmodel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 与原本地安装保持同版本的单机 Nacos，使用内置 Derby 持久化本地开发配置。
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: leetmodel-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # 第三方 AI 网关。LeetModel ai-gateway-service 的 Chat 调用统一经由该上游。
  new-api:
    image: calciumion/new-api:v1.0.0-rc.26
    container_name: leetmodel-new-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:-leetmodel-local-new-api-session-secret-change-in-shared-environments}
      ERROR_LOG_ENABLED: "true"
    volumes:
      - new-api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # RAG V1 正式向量索引。固定版本与 LangChain4j 0.34.0 的 ES 8.14.3 客户端同代。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: leetmodel-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # RocketMQ 5.5.0 本地 NameServer。只绑定回环地址，不作为生产拓扑。
  rocketmq-namesrv:
    image: apache/rocketmq:5.5.0
    container_name: leetmodel-rocketmq-namesrv
    restart: unless-stopped
    user: root
    command:
      - /bin/bash
      - -c
      - >-
        install -d -o rocketmq -g rocketmq /home/rocketmq/logs &&
        exec runuser -u rocketmq -- ./mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx256m -Xmn64m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # 经典 Remoting 客户端使用的单 Broker，本地数据与日志通过命名卷保留。
  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    container_name: leetmodel-rocketmq-broker
    restart: unless-stopped
    user: root
    command:
      - /bin/bash
      - -c
      - >-
        install -d -o rocketmq -g rocketmq /home/rocketmq/logs /home/rocketmq/store &&
        exec runuser -u rocketmq -- ./mqbroker
        -c /home/rocketmq/rocketmq-5.5.0/conf/leetmodel-broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx512m -Xmn128m
      TZ: Asia/Shanghai
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10912:10912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.5.0/conf/leetmodel-broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "./mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q LeetModelLocalCluster"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 可选观察工具：docker compose --profile tools up -d rocketmq-dashboard
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.1.0
    container_name: leetmodel-rocketmq-dashboard
    restart: unless-stopped
    profiles: ["tools"]
    # Broker 为宿主机 Java 客户端通告 127.0.0.1；Dashboard 使用 host 网络读取同一路由。
    network_mode: host
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=127.0.0.1:9876 -Dserver.port=8180
      TZ: Asia/Shanghai
    depends_on:
      rocketmq-broker:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nacos-data:
  nacos-logs:
  new-api-data:
  elasticsearch-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
