# ==================== LeetModel 本地开发基础设施 ====================
# 使用方式：docker compose up -d --wait mysql redis minio new-api
# Nacos 复用本机 ${NACOS_HOME:-~/repo/nacos}，由 scripts/start-mvp.sh 按需启动。

services:
  mysql:
    image: mysql:8.0.33
    container_name: leetmodel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: leetmodel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: leetmodel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 第三方 AI 网关。当前只完成独立部署，LeetModel ai-gateway-service 尚未切换到该上游。
  new-api:
    image: calciumion/new-api:v1.0.0-rc.26
    container_name: leetmodel-new-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:-leetmodel-local-new-api-session-secret-change-in-shared-environments}
      ERROR_LOG_ENABLED: "true"
    volumes:
      - new-api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
  redis-data:
  minio-data:
  new-api-data:
