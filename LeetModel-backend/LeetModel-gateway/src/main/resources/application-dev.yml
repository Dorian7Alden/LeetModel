# ==================== LeetModel-gateway 开发环境配置 ====================

server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  autoconfigure:
    # Gateway 不连接数据库，禁用 DataSource 自动配置
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    # Nacos 服务发现
    nacos:
      discovery:
        server-addr: localhost:8848

    # === 路由规则 ===
    # lb:// 前缀 = 从 Nacos 按服务名拉取实例列表 + 负载均衡
    gateway:
      routes:
        # ---- user 服务（8081）----
        - id: user-auth
          uri: lb://leetmodel-user
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://leetmodel-user
          predicates:
            - Path=/api/users/**

        # ---- team 服务（8082）----
        - id: team-service
          uri: lb://leetmodel-team
          predicates:
            - Path=/api/teams/**

        # ---- problem 服务（8083）----
        - id: problem-service
          uri: lb://leetmodel-problem
          predicates:
            - Path=/api/problems/**

        # ---- 公开题目浏览 ----
        - id: problem-public
          uri: lb://leetmodel-problem
          predicates:
            - Path=/api/public/problems/**

        # ---- 标签管理 ----
        - id: tag-service
          uri: lb://leetmodel-problem
          predicates:
            - Path=/api/tags/**

        # ---- 管理后台 - 用户管理 ----
        - id: admin-user
          uri: lb://leetmodel-user
          predicates:
            - Path=/api/admin/users/**,/api/admin/roles/**,/api/admin/permissions/**

# JWT 密钥（与 user 服务保持一致，否则校验签名失败）
jwt:
  secret-key: leetmodel-dev-secret-key-2026
  timeout: 604800

# Redis —— JWT Token 黑名单（登出后 Token 不可再用）
spring:
  data:
    redis:
      host: localhost
      port: 6379

# 暴露 Actuator 端点（K8s 探活/就绪探针）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ==================== Knife4j 网关聚合 ====================
# 原理：Gateway 自身托管 /doc.html 页面，用户切换服务分组时，
# Gateway 从 Nacos 发现下游服务实例，转发 /v3/api-docs 请求获取 OpenAPI JSON
knife4j:
  gateway:
    enabled: true                # 启用网关聚合
    strategy: discover           # 基于 Nacos 服务发现自动聚合
    discover:
      enabled: true
      version: openapi3          # 下游服务使用 OpenAPI 3 规范（knife4j-openapi3-jakarta）
      # 排除网关自身，避免聚合空的文档分组
      excluded-services: leetmodel-gateway

# 鉴权白名单在 SaTokenConfig.java 中通过 .addExclude() 配置，此处不重复声明
