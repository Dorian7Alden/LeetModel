server:
  port: 8093
spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
common:
  ai-client:
    enabled: true
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
knowledge:
  retrieval:
    knowledge-base-path: ${KNOWLEDGE_BASE_PATH:../rag_kb}
    index-alias: ${KNOWLEDGE_INDEX_ALIAS:leetmodel-rag-v1-read}
    elasticsearch-uri: ${KNOWLEDGE_ELASTICSEARCH_URI:http://127.0.0.1:9200}
    embedding-model-version: ${KNOWLEDGE_EMBEDDING_MODEL_VERSION:qwen3.7-text-embedding@1024}
    embedding-dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:1024}
    top-k: ${KNOWLEDGE_TOP_K:8}
    token-budget: ${KNOWLEDGE_TOKEN_BUDGET:3000}
    score-threshold: ${KNOWLEDGE_SCORE_THRESHOLD:0.65}
    request-timeout: ${KNOWLEDGE_REQUEST_TIMEOUT:5s}
management:
  endpoints:
    web:
      exposure:
        include: health,info
